name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA of the release to recover
        required: true
        type: string
      dry_run:
        description: Validate plan and artifacts without publishing
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  HUSKY: '0'

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Prefer RELEASE_GITHUB_TOKEN so the Version Packages PR triggers CI.
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tool versions
        run: |
          node -v
          pnpm -v
          npm -v

      - name: Guard recovery runs from main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Recovery must be started from main (got ${GITHUB_REF})"
            exit 1
          fi
          echo "execution_sha=${GITHUB_SHA}"
          echo "release_sha=${{ inputs.release_sha }}"

      - name: Wait for CI on this SHA
        if: github.event_name == 'push'
        id: wait_ci
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          REQUIRED_CHECK_NAMES: ci-result,pack-release-artifacts
          PACK_ARTIFACT_CHECK_NAME: pack-release-artifacts
        run: node scripts/wait-for-ci.mjs

      - name: Download release artifacts from CI
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts-${{ github.sha }}
          path: .release-artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.wait_ci.outputs.run_id }}

      - name: Create release PR or publish
        if: github.event_name == 'push'
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          create-github-releases: false
          push-git-tags: false
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        env:
          # Trusted publishing / OIDC — do not inject NPM_TOKEN here.
          NPM_CONFIG_PROVENANCE: 'true'
          RELEASE_ARTIFACTS_DIR: ${{ github.workspace }}/.release-artifacts
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - name: Resolve original CI artifacts for recovery
        if: github.event_name == 'workflow_dispatch'
        id: recovery_ci
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          REQUIRED_CHECK_NAMES: ci-result,pack-release-artifacts
          PACK_ARTIFACT_CHECK_NAME: pack-release-artifacts
        run: node scripts/resolve-recovery-ci.mjs

      - name: Download original release artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts-${{ inputs.release_sha }}
          path: .release-artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.recovery_ci.outputs.run_id }}

      - name: Recover partial release
        if: github.event_name == 'workflow_dispatch'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          RELEASE_RECOVERY: '1'
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ARTIFACTS_DIR: ${{ github.workspace }}/.release-artifacts
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm run release -- --dry-run
          else
            pnpm run release
          fi
