name: release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  HUSKY: '0'

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Prefer RELEASE_GITHUB_TOKEN so the Version Packages PR triggers CI.
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Wait for CI on this SHA
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          REQUIRED_CHECK_NAMES: ci-result,pack-release-artifacts
        run: node scripts/wait-for-ci.mjs

      - name: Resolve pack artifact run
        id: pack_run
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&status=completed&per_page=20" \
            --jq '.workflow_runs[] | select(.name=="ci") | .id' | head -n 1)
          if [ -z "$RUN_ID" ]; then
            echo "Could not find completed ci workflow run for ${SHA}"
            exit 1
          fi
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts from CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts-${{ github.sha }}
          path: .release-artifacts
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.pack_run.outputs.run_id }}

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          create-github-releases: false
          push-git-tags: false
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        env:
          # Trusted publishing / OIDC — do not inject NPM_TOKEN here.
          NPM_CONFIG_PROVENANCE: 'true'
          RELEASE_ARTIFACTS_DIR: ${{ github.workspace }}/.release-artifacts
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
