name: ci

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  check:
    name: ${{ matrix.os }} / node 24.21.0
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @vtex-email/example build

  changeset:
    name: changeset
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch base ref
        run: git fetch origin "${{ github.base_ref }}"
      - name: Changeset status
        if: ${{ !startsWith(github.head_ref, 'changeset-release/') && !startsWith(github.event.pull_request.title, 'chore(release):') }}
        run: pnpm exec changeset status --since="origin/${{ github.base_ref }}"
      - name: Changeset coverage
        env:
          CHANGESET_BASE_REF: origin/${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: pnpm changeset:check

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch base ref
        run: git fetch origin "${{ github.base_ref }}"
      - name: Lint PR commits and title
        env:
          COMMITLINT_BASE: ${{ github.base_ref }}
          COMMITLINT_HEAD: HEAD
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/commitlint-pr.mjs

  ci-result:
    name: ci-result
    runs-on: ubuntu-latest
    if: always()
    needs: [check, changeset, commitlint]
    steps:
      - name: Require successful checks
        env:
          CHECK: ${{ needs.check.result }}
          CHANGESET: ${{ needs.changeset.result }}
          COMMITLINT: ${{ needs.commitlint.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$CHECK" != "success" ]; then
            echo "check job failed: $CHECK"
            exit 1
          fi
          if [ "$EVENT" = "pull_request" ]; then
            if [ "$CHANGESET" != "success" ]; then
              echo "changeset job failed: $CHANGESET"
              exit 1
            fi
            if [ "$COMMITLINT" != "success" ]; then
              echo "commitlint job failed: $COMMITLINT"
              exit 1
            fi
          else
            # Push events skip PR-only jobs (result=skipped) — still a defined success path.
            if [ "$CHANGESET" != "skipped" ] && [ "$CHANGESET" != "success" ]; then
              echo "unexpected changeset result on push: $CHANGESET"
              exit 1
            fi
            if [ "$COMMITLINT" != "skipped" ] && [ "$COMMITLINT" != "success" ]; then
              echo "unexpected commitlint result on push: $COMMITLINT"
              exit 1
            fi
          fi
          echo "CI gate passed"
